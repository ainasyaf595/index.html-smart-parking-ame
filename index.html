<!DOCTYPE html>
<html>
<head>
<title>Smart Parking Live</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#dcdcdc;
  margin:0;
  text-align:center;
}

h2{
  background:#1a237e;
  color:white;
  padding:15px;
  margin:0;
}

/* ================= PARKING ================= */
.parking-row{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:25px;
}

.slot{
  width:140px;
  height:200px;
  background:green;
  border-radius:6px;
  position:relative;
  box-shadow:inset 0 0 12px black;
}

.slot-label{
  color:white;
  font-weight:bold;
  margin-top:10px;
}

/* CAR */
.car{
  width:80px;
  height:45px;
  position:absolute;
  bottom:-100px;
  left:30px;
  transition:.6s;
}
.car.in{bottom:20px;}
.car.out{bottom:-120px;}

/* ================= FRONT ROAD ================= */
.front-road-container{
  position:relative;
  width:100%;
  height:120px;
  margin-top:10px;
}

.front-road{
  width:140px;
  height:80px;
  background:linear-gradient(#555,#2f2f2f);
  border-radius:18px;
  box-shadow:inset 0 0 20px black;
  position:absolute;
  bottom:0;
}

/* MASUK kiri */
#roadIn{
  left:10%;
}

/* KELUAR kanan */
#roadOut{
  right:10%;
}

/* ARROW */
.arrow{
  width:0;height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  position:absolute;
  left:52px;
}

.arrow.in{
  border-bottom:30px solid white;
  top:20px;
}

.arrow.out{
  border-top:30px solid white;
  bottom:20px;
}

/* INFO */
#infoPanel{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#1a237e;
  color:white;
  padding:15px;
  border-radius:12px;
}

#qrPanel{
  position:fixed;
  bottom:20px;
  left:20px;
  background:white;
  padding:15px;
  border-radius:12px;
}
</style>

<script>
async function loadData(){
  const url="https://smart-parking-aee-default-rtdb.asia-southeast1.firebasedatabase.app/parking.json";
  const res=await fetch(url);
  const data=await res.json();
  let empty=0;

  for(let i=1;i<=5;i++){
    const id="slot"+i;
    const status=data[id].status;
    if(status==="empty") empty++;
    updateSlot(id,status);
  }
  document.getElementById("emptyCount").innerHTML=empty;
}

function updateSlot(id,status){
  const slot=document.getElementById(id);
  slot.style.background=status==="occupied"?"red":"green";
  const car=slot.querySelector(".car");

  if(status==="occupied" && !car){
    const img=document.createElement("img");
    img.src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='50'><rect x='5' y='5' width='80' height='40' rx='10' fill='%23ffeb3b' stroke='black' stroke-width='3'/></svg>";
    img.className="car";
    slot.appendChild(img);
    setTimeout(()=>img.classList.add("in"),30);
  }

  if(status==="empty" && car){
    car.classList.add("out");
    setTimeout(()=>car.remove(),600);
  }
}

function updateClock(){
  document.getElementById("clock").innerHTML=new Date().toLocaleTimeString();
}

function generateQR(){
  new QRCode(document.getElementById("qrcode"),{
    text: window.location.href,
    width: 140,
    height: 140
  });
}

setInterval(loadData,800);
setInterval(updateClock,1000);
window.onload=generateQR;
</script>
</head>

<body>

<h2>SMART PARKING LIVE</h2>

<!-- PARKING -->
<div class="parking-row">
  <div id="slot1" class="slot"><div class="slot-label">Slot 1</div></div>
  <div id="slot2" class="slot"><div class="slot-label">Slot 2</div></div>
  <div id="slot3" class="slot"><div class="slot-label">Slot 3</div></div>
  <div id="slot4" class="slot"><div class="slot-label">Slot 4</div></div>
  <div id="slot5" class="slot"><div class="slot-label">Slot 5</div></div>
</div>

<!-- JALAN DEPAN -->
<div class="front-road-container">
  <div class="front-road" id="roadIn">
    <div class="arrow in"></div>
  </div>

  <div class="front-road" id="roadOut">
    <div class="arrow out"></div>
  </div>
</div>

<div id="infoPanel">
  Masa: <span id="clock"></span><br>
  Slot Kosong: <span id="emptyCount">0</span>
</div>

<div id="qrPanel">
  <h4>Scan untuk Akses</h4>
  <div id="qrcode"></div>
</div>

</body>
</html>
